[env:transmitter]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = 
	nrf24/RF24@^1.6.2
	arduino-libraries/Servo@^1.3.0
build_src_filter = 
	+<transmitter.cpp>
upload_port = COM10

[env:receiver]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = 
	nrf24/RF24@^1.6.2
	arduino-libraries/Servo@^1.3.0
build_src_filter = 
	+<receiver.cpp>
upload_port = COM12
